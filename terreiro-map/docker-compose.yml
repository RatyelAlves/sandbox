services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: terreiro
      POSTGRES_PASSWORD: terreiro
      POSTGRES_DB: terreiro_map
    volumes:
      - terreiro_pg_data:/var/lib/postgresql/data

volumes:
  terreiro_pg_data:
