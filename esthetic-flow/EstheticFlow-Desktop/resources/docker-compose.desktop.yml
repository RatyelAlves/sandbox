services:

  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: estheticflow_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://host.docker.internal:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-estheticflow-desktop}
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1039700148"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: sqlite
      DATABASE_CONNECTION_URI: file:/evolution/instances/evolution.db
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      LOG_LEVEL: ERROR
    volumes:
      - evolution_data:/evolution/instances

volumes:
  evolution_data:
