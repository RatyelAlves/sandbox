<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>EstheticFlow</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #fff1f2, #fafafa);
        color: #3f3f46;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        text-align: center;
        padding: 32px;
      }
      h1 {
        font-size: 28px;
        color: #be123c;
        margin-bottom: 8px;
      }
      p { font-size: 14px; color: #71717a; }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #fecdd3;
        border-top-color: #e11d48;
        border-radius: 50%;
        margin: 24px auto 16px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #status { font-size: 13px; color: #52525b; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>EstheticFlow</h1>
      <p>Preparando o sistema...</p>
      <div class="spinner"></div>
      <p id="status">Isso pode levar até 1 minuto na primeira vez.</p>
    </div>
  </body>
</html>
