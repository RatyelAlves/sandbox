services:

  evolution_postgres:
    image: postgres:15
    container_name: evolution_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evolution
    ports:
      - "5432:5432"
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

  estheticflow_postgres:
    image: postgres:15
    container_name: estheticflow_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estheticflow
    ports:
      - "5433:5432"
    volumes:
      - estheticflow_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: evolution_redis
    restart: always
    ports:
      - "6379:6379"

  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: evolution_api
    restart: always
    depends_on:
      - evolution_postgres
      - redis
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: admin
      # Deixe vazio para a Evolution buscar a versão atual do WhatsApp Web.
      # Versão fixa desatualizada costuma travar o QR em {"count":0}.
      CONFIG_SESSION_PHONE_VERSION: ""
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      WPP_LID_MODE: "false"
      DATABASE_ENABLED: true
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:postgres@evolution_postgres:5432/evolution
      CACHE_REDIS_ENABLED: true
      CACHE_REDIS_URI: redis://redis:6379
      REDIS_ENABLED: true
      REDIS_URI: redis://redis:6379
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_postgres_data:
  estheticflow_postgres_data:
  evolution_instances:
